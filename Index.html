<!DOCTYPE html>
<Smaa lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bangla Smart Assistant</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f2f4f7;
  padding: 15px;
}

.app {
  max-width: 500px;
  margin: auto;
}

.header {
  text-align: center;
  padding: 15px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

textarea,
input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  margin-bottom: 10px;
}

textarea {
  height: 90px;
  resize: none;
}

button {
  border: 0;
  padding: 11px 16px;
  border-radius: 10px;
  cursor: pointer;
  margin: 3px;
}

.main-btn {
  width: 100%;
  background: #222;
  color: white;
}

.voice-btn {
  display: block;
  width: 80px;
  height: 80px;
  margin: 15px auto;
  border-radius: 50%;
  font-size: 32px;
  background: #222;
  color: white;
}

.voice-btn.listening {
  transform: scale(1.08);
}

.voice-text {
  background: #f7f7f7;
  padding: 12px;
  border-radius: 10px;
  min-height: 45px;
}

.item {
  background: #f7f7f7;
  padding: 12px;
  border-radius: 10px;
  margin-top: 8px;
}

.delete {
  float: right;
}

.completed {
  text-decoration: line-through;
  opacity: .5;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<>🤖 <h1>🤖 CHAYAN AI</h1>
<Assista>Bangla Smart VoicAsissistan>
</div>


<!-- VOICE -->

<div class="card">  
 <h2>🎤 CHAYAN AI Voice Assistant</h2>

<p style="text-align:center;">
বাংলায় কথা বলুন
</p>

<button
id="voiceBtn"
class="voice-btn"
onclick="startVoice()">
🎤
</button>

<div id="voiceText" class="voice-text">
আপনার কথা এখানে দেখা যাবে...
</div>

</div>


<!-- NOTES -->

<div class="card">

<h2>📝 Notes</h2>

<textarea
id="noteInput"
placeholder="আপনার Note লিখুন..."></textarea>

<button
class="main-btn"
onclick="saveNote()">
💾 Save Note
</button>

<div id="notesList"></div>

</div>


<!-- TASK -->

<div class="card">

<h2>📋 Daily Task</h2>

<input
id="taskInput"
placeholder="আজকের কাজ লিখুন...">

<button
class="main-btn"
onclick="addTask()">
➕ Add Task
</button>

<div id="taskList"></div>

</div>


<!-- REMINDER -->

<div class="card">

<h2>⏰ Reminder</h2>

<input
id="reminderText"
placeholder="Reminder লিখুন...">

<input
id="reminderTime"
type="datetime-local">

<button
class="main-btn"
onclick="setReminder()">
⏰ Set Reminder
</button>

<div id="reminderList"></div>

</div>

</div>


<script>

/* ================= VOICE ================= */

function startVoice() {

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if (!SpeechRecognition) {

alert(
"আপনার Browser Voice Recognition support করছে না। Chrome ব্যবহার করুন।"
);

return;
}

const recognition =
new SpeechRecognition();

recognition.lang = "bn-BD";

recognition.continuous = false;

recognition.interimResults = false;

const button =
document.getElementById("voiceBtn");

const output =
document.getElementById("voiceText");

button.classList.add("listening");

output.innerText =
"🎧 শুনছি... কথা বলুন";

recognition.start();

recognition.onresult = function(event) {

const text =
event.results[0][0].transcript;

output.innerText = text;

};

recognition.onerror = function(event) {

output.innerText =
"❌ Voice error: " + event.error;

};

recognition.onend = function() {

button.classList.remove("listening");

};

}


/* ================= NOTES ================= */

function saveNote() {

let input =
document.getElementById("noteInput");

let text =
input.value.trim();

if (!text) {

alert("আগে Note লিখুন!");

return;
}

let notes =
JSON.parse(localStorage.getItem("notes")) || [];

notes.push(text);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

input.value = "";

showNotes();
}


function showNotes() {

let notes =
JSON.parse(localStorage.getItem("notes")) || [];

let list =
document.getElementById("notesList");

list.innerHTML = "";

notes.forEach((note,index) => {

list.innerHTML += `
<div class="item">

${note}

<button
class="delete"
onclick="deleteNote(${index})">
🗑️
</button>

<div style="clear:both"></div>

</div>
`;

});
}


function deleteNote(index) {

let notes =
JSON.parse(localStorage.getItem("notes")) || [];

notes.splice(index,1);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

showNotes();
}


/* ================= TASK ================= */

function addTask() {

let input =
document.getElementById("taskInput");

let text =
input.value.trim();

if (!text) {

alert("কাজ লিখুন!");

return;
}

let tasks =
JSON.parse(localStorage.getItem("tasks")) || [];

tasks.push({
text: text,
done: false
});

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

input.value = "";

showTasks();
}


function showTasks() {

let tasks =
JSON.parse(localStorage.getItem("tasks")) || [];

let list =
document.getElementById("taskList");

list.innerHTML = "";

tasks.forEach((task,index) => {

list.innerHTML += `

<div class="item">

<span
onclick="completeTask(${index})"
class="${task.done ? 'completed' : ''}">

${task.done ? "✅" : "⬜"}
${task.text}

</span>

<button
class="delete"
onclick="deleteTask(${index})">
🗑️
</button>

<div style="clear:both"></div>

</div>

`;

});
}


function completeTask(index) {

let tasks =
JSON.parse(localStorage.getItem("tasks")) || [];

tasks[index].done =
!tasks[index].done;

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();
}


function deleteTask(index) {

let tasks =
JSON.parse(localStorage.getItem("tasks")) || [];

tasks.splice(index,1);

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();
}


/* ================= REMINDER ================= */

function setReminder() {

let text =
document.getElementById("reminderText").value;

let time =
document.getElementById("reminderTime").value;

if (!text || !time) {

alert("Reminder এবং সময় দিন!");

return;
}

let reminders =
JSON.parse(localStorage.getItem("reminders")) || [];

reminders.push({
text: text,
time: time
});

localStorage.setItem(
"reminders",
JSON.stringify(reminders)
);

document.getElementById("reminderText").value = "";

showReminders();
}


function showReminders() {

let reminders =
JSON.parse(localStorage.getItem("reminders")) || [];

let list =
document.getElementById("reminderList");

list.innerHTML = "";

reminders.forEach((r,index) => {

list.innerHTML += `

<div class="item">

⏰ ${r.text}

<br>

<small>${r.time}</small>

<button
class="delete"
onclick="deleteReminder(${index})">
🗑️
</button>

<div style="clear:both"></div>

</div>

`;

});
}


function deleteReminder(index) {

let reminders =
JSON.parse(localStorage.getItem("reminders")) || [];

reminders.splice(index,1);

localStorage.setItem(
"reminders",
JSON.stringify(reminders)
);

showReminders();
}


/* ================= START ================= */

showNotes();
showTasks();
showReminders();

</script>

</body>
</Smaa
