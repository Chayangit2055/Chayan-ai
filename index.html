<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAYAN AI</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#eef1f5;
  padding:15px;
}

.app{
  max-width:520px;
  margin:auto;
}

.header{
  text-align:center;
  padding:20px 10px;
}

.header h1{
  margin:0;
  font-size:32px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

input,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:10px;
}

textarea{
  height:80px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
}

.main{
  width:100%;
  background:#222;
  color:white;
}

.voice{
  display:block;
  width:90px;
  height:90px;
  margin:20px auto;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:34px;
}

.voice.active{
  transform:scale(1.08);
}

.voiceText{
  background:#f5f5f5;
  padding:13px;
  border-radius:10px;
  text-align:center;
  min-height:45px;
}

.chat{
  height:250px;
  overflow-y:auto;
  background:#f5f5f5;
  padding:10px;
  border-radius:12px;
}

.message{
  padding:10px;
  margin:7px 0;
  border-radius:10px;
}

.user{
  background:#ddd;
  text-align:right;
}

.ai{
  background:#e9e9e9;
}

.item{
  background:#f6f6f6;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
}

.delete{
  float:right;
  background:none;
  padding:3px;
}

.done{
  text-decoration:line-through;
  opacity:.5;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<h1>🤖 CHAYAN AI</h1>
<p>Bangla Smart Voice Assistant</p>
</div>


<!-- VOICE -->

<div class="card">

<h2>🎤 Voice Assistant</h2>

<button
id="voiceBtn"
class="voice"
onclick="startVoice()">
🎤
</button>

<div
id="voiceText"
class="voiceText">
মাইক্রোফোন চাপুন...
</div>

</div>


<!-- CHAT -->

<div class="card">

<h2>💬 CHAYAN AI Chat</h2>

<div
id="chatBox"
class="chat">

<div class="message ai">
🤖 হ্যালো! আমি CHAYAN AI। আমাকে কিছু বলুন।
</div>

</div>

<br>

<input
id="chatInput"
placeholder="এখানে লিখুন...">

<button
class="main"
onclick="sendMessage()">
🚀 Send
</button>

</div>


<!-- NOTES -->

<div class="card">

<h2>📝 Notes</h2>

<textarea
id="noteInput"
placeholder="Note লিখুন..."></textarea>

<button
class="main"
onclick="saveNote()">
💾 Save Note
</button>

<div id="notesList"></div>

</div>


<!-- TASK -->

<div class="card">

<h2>📋 Daily Tasks</h2>

<input
id="taskInput"
placeholder="Task লিখুন...">

<button
class="main"
onclick="addTask()">
➕ Add Task
</button>

<div id="taskList"></div>

</div>

</div>


<script>

/* ===============================
VOICE
================================ */

function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"Chrome browser ব্যবহার করুন।"
);

return;
}

const recognition =
new SpeechRecognition();

recognition.lang="bn-BD";

recognition.continuous=false;

recognition.interimResults=false;

const btn=
document.getElementById("voiceBtn");

const output=
document.getElementById("voiceText");

btn.classList.add("active");

output.innerText=
"🎧 শুনছি...";

try{

recognition.start();

}catch(e){

output.innerText=
"Voice already running...";

}


recognition.onresult=function(event){

const text=
event.results[0][0].transcript;

output.innerText=
"🗣️ "+text;

document.getElementById(
"chatInput"
).value=text;

sendMessage();

};


recognition.onerror=function(event){

output.innerText=
"❌ Voice: "+event.error;

btn.classList.remove("active");

};


recognition.onend=function(){

btn.classList.remove("active");

};

}


/* ===============================
CHAT
================================ */

function sendMessage(){

const input=
document.getElementById(
"chatInput"
);

const text=
input.value.trim();

if(!text){

return;
}

addMessage(
text,
"user"
);

input.value="";


const answer=
smartAI(text);

setTimeout(function(){

addMessage(
answer,
"ai"
);

speak(answer);

},300);

}


/* ===============================
MESSAGE
================================ */

function addMessage(
text,
type
){

const box=
document.getElementById(
"chatBox"
);

const div=
document.createElement(
"div"
);

div.className=
"message "+type;

div.innerText=
(type==="ai"?"🤖 ":"👤 ")+text;

box.appendChild(div);

box.scrollTop=
box.scrollHeight;

}


/* ===============================
SMART AI
================================ */

function smartAI(text){

const q=
text.toLowerCase().trim();


/* পরিচয় */

if(
q.includes("তুমি কে") ||
q.includes("তোমার নাম") ||
q.includes("who are you") ||
q.includes("tumi ke")
){

return "আমি CHAYAN AI। আমি আপনার বাংলা Smart Voice Assistant।";

}


/* হ্যালো */

if(
q.includes("হ্যালো") ||
q.includes("হাই") ||
q.includes("hello") ||
q.includes("hi")
){

return "হ্যালো! 😊 আমি CHAYAN AI। কীভাবে সাহায্য করতে পারি?";

}


/* Python */

if(
q.includes("python") ||
q.includes("পাইথন")
){

return "Python একটি জনপ্রিয় programming language। এটি AI, Data Science, Web Development এবং Automation-এ ব্যবহার করা হয়।";

}


/* Computer Science */

if(
q.includes("computer science") ||
q.includes("কম্পিউটার সায়েন্স") ||
q.includes("কম্পিউটার সাইন্স")
){

return "Computer Science-এর মধ্যে Programming, Algorithm, Database, Software, AI, Networking এবং অনেক computer technology শেখানো হয়।";

}


/* Note দেখাও */

if(
q.includes("নোট দেখাও") ||
q.includes("notes দেখাও") ||
q.includes("note দেখাও")
){

const notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

if(notes.length===0){

return "আপনার কোনো Note নেই।";

}

return "আপনার "+notes.length+
"টি Note আছে।";

}


/* Task দেখাও */

if(
q.includes("task দেখাও") ||
q.includes("টাস্ক দেখাও") ||
q.includes("কাজ দেখাও")
){

const tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

if(tasks.length===0){

return "আপনার কোনো Task নেই।";

}

return "আপনার "+tasks.length+
"টি Task আছে।";

}


/* Note command */

if(
q.includes("note") ||
q.includes("নোট") ||
q.includes("মনে রাখ")
){

let note=text
.replace(/note/gi,"")
.replace(/নোট/g,"")
.replace(/করো/g,"")
.replace(/মনে রাখ/g,"")
.trim();

if(note){

let notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

notes.push(note);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

showNotes();

return "ঠিক আছে। আমি Note save করেছি।";

}

}


/* Task command */

if(
q.includes("task") ||
q.includes("টাস্ক") ||
q.includes("কাজ যোগ")
){

let task=text
.replace(/task/gi,"")
.replace(/টাস্ক/g,"")
.replace(/কাজ যোগ/g,"")
.replace(/কাজ/g,"")
.replace(/করো/g,"")
.trim();

if(task){

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks.push({

text:task,

done:false

});

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

return "ঠিক আছে। আমি Task যোগ করেছি।";

}

}


/* সাহায্য */

if(
q.includes("কি করতে পারো") ||
q.includes("কী করতে পারো") ||
q.includes("help") ||
q.includes("সাহায্য")
){

return "আমি Voice command নিতে পারি, Note save করতে পারি, Task তৈরি করতে পারি এবং কিছু সাধারণ প্রশ্নের উত্তর দিতে পারি।";

}


/* ধন্যবাদ */

if(
q.includes("ধন্যবাদ") ||
q.includes("thanks")
){

return "আপনাকেও ধন্যবাদ। 😊";

}


/* default */

return "আমি কথাটি বুঝেছি, কিন্তু এই command এখনো আমার মধ্যে যোগ করা হয়নি।";

}


/* ===============================
VOICE REPLY
================================ */

function speak(text){

if("speechSynthesis" in window){

speechSynthesis.cancel();

const voice=
new SpeechSynthesisUtterance(text);

voice.lang="bn-BD";

voice.rate=1;

speechSynthesis.speak(voice);

}

}


/* ===============================
NOTES
================================ */

function saveNote(){

const input=
document.getElementById(
"noteInput"
);

const text=
input.value.trim();

if(!text){

alert("Note লিখুন!");

return;
}

let notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

notes.push(text);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

input.value="";

showNotes();

}


function showNotes(){

const notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

const list=
document.getElementById(
"notesList"
);

list.innerHTML="";

notes.forEach(
function(note,index){

list.innerHTML+=`

<div class="item">

${escapeHTML(note)}

<button
class="delete"
onclick="deleteNote(${index})">
🗑️
</button>

<div style="clear:both"></div>

</div>

`;

});

}


function deleteNote(index){

let notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

notes.splice(index,1);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

showNotes();

}


/* ===============================
TASKS
================================ */

function addTask(){

const input=
document.getElementById(
"taskInput"
);

const text=
input.value.trim();

if(!text){

alert("Task লিখুন!");

return;
}

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks.push({

text:text,

done:false

});

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

input.value="";

showTasks();

}


function showTasks(){

const tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

const list=
document.getElementById(
"taskList"
);

list.innerHTML="";

tasks.forEach(
function(task,index){

list.innerHTML+=`

<div class="item">

<span
onclick="completeTask(${index})"
class="${task.done?"done":""}">

${task.done?"✅":"⬜"}
${escapeHTML(task.text)}

</span>

<button
class="delete"
onclick="deleteTask(${index})">
🗑️
</button>

<div style="clear:both"></div>

</div>

`;

});

}


function completeTask(index){

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks[index].done=
!tasks[index].done;

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

}


function deleteTask(index){

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks.splice(index,1);

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

}


/* ===============================
SECURITY
================================ */

function escapeHTML(text){

const div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}


/* ===============================
START
================================ */

showNotes();
showTasks();

</script>

</body>
</html>
