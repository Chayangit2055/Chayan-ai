<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAYAN AI</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f2f4f7;
  padding:15px;
}

.app{
  max-width:500px;
  margin:auto;
}

.header{
  text-align:center;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.voice-btn{
  display:block;
  width:85px;
  height:85px;
  margin:15px auto;
  border-radius:50%;
  border:0;
  font-size:32px;
  background:#222;
  color:white;
}

.voice-btn.listening{
  transform:scale(1.1);
}

.voice-text{
  background:#f7f7f7;
  padding:12px;
  border-radius:10px;
  min-height:45px;
  text-align:center;
}

input,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:10px;
}

textarea{
  height:80px;
}

button{
  border:0;
  padding:11px 16px;
  border-radius:10px;
  cursor:pointer;
}

.main-btn{
  width:100%;
  background:#222;
  color:white;
}

.item{
  background:#f7f7f7;
  padding:12px;
  border-radius:10px;
  margin-top:8px;
}

.delete{
  float:right;
}

.completed{
  text-decoration:line-through;
  opacity:.5;
}

.response{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#eef1f5;
  text-align:center;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<h1>🤖 CHAYAN AI</h1>
<p>Bangla Smart Voice Assistant</p>
</div>


<!-- VOICE -->

<div class="card">

<h2>🎤 Voice Assistant</h2>

<button
id="voiceBtn"
class="voice-btn"
onclick="startVoice()">
🎤
</button>

<div id="voiceText" class="voice-text">
মাইক্রোফোন চাপুন এবং কথা বলুন
</div>

<div id="response" class="response">
আমি আপনার command-এর অপেক্ষায় আছি।
</div>

</div>


<!-- NOTES -->

<div class="card">

<h2>📝 Notes</h2>

<textarea
id="noteInput"
placeholder="Note লিখুন..."></textarea>

<button
class="main-btn"
onclick="saveNote()">
💾 Save Note
</button>

<div id="notesList"></div>

</div>


<!-- TASK -->

<div class="card">

<h2>📋 Daily Task</h2>

<input
id="taskInput"
placeholder="Task লিখুন...">

<button
class="main-btn"
onclick="addTask()">
➕ Add Task
</button>

<div id="taskList"></div>

</div>

</div>


<script>

/* ================= VOICE ================= */

function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Chrome browser ব্যবহার করুন।");

return;
}

const recognition =
new SpeechRecognition();

recognition.lang="bn-BD";

recognition.continuous=false;

recognition.interimResults=false;

const btn =
document.getElementById("voiceBtn");

const voiceText =
document.getElementById("voiceText");

btn.classList.add("listening");

voiceText.innerText="🎧 শুনছি...";

recognition.start();


recognition.onresult=function(event){

const text =
event.results[0][0].transcript;

voiceText.innerText=text;

processCommand(text);

};


recognition.onerror=function(event){

voiceText.innerText=
"❌ "+event.error;

btn.classList.remove("listening");

};


recognition.onend=function(){

btn.classList.remove("listening");

};

}


/* ================= SMART BRAIN ================= */

function processCommand(text){

let command=text.toLowerCase();


// NOTE

if(
command.includes("note করো") ||
command.includes("নোট করো") ||
command.includes("note")
){

let note=text
.replace(/note/gi,"")
.replace(/নোট/gi,"")
.replace(/করো/gi,"")
.trim();

if(note){

let notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

notes.push(note);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

showNotes();

reply("ঠিক আছে, Note save করেছি।");

return;
}

}


// TASK

if(
command.includes("task") ||
command.includes("টাস্ক") ||
command.includes("কাজ যোগ")
){

let task=text
.replace(/task/gi,"")
.replace(/টাস্ক/gi,"")
.replace(/যোগ করো/gi,"")
.replace(/কাজ যোগ/gi,"")
.trim();

if(task){

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks.push({
text:task,
done:false
});

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

reply("ঠিক আছে, Task যোগ করেছি।");

return;
}

}


// SHOW NOTES

if(
command.includes("notes দেখাও") ||
command.includes("নোট দেখাও")
){

let notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

reply(
"আপনার মোট "+notes.length+
"টি Note আছে।"
);

return;
}


// SHOW TASK

if(
command.includes("task দেখাও") ||
command.includes("কাজ দেখাও")
){

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

reply(
"আপনার মোট "+tasks.length+
"টি Task আছে।"
);

return;
}


// UNKNOWN

reply(
"দুঃখিত, এই Command এখনো শিখিনি।"
);

}


/* ================= AI REPLY ================= */

function reply(text){

document.getElementById(
"response"
).innerText="🤖 "+text;

speak(text);

}


/* ================= VOICE REPLY ================= */

function speak(text){

if("speechSynthesis" in window){

let speech=
new SpeechSynthesisUtterance(text);

speech.lang="bn-BD";

speech.rate=1;

speechSynthesis.speak(speech);

}

}


/* ================= NOTES ================= */

function saveNote(){

let input=
document.getElementById("noteInput");

let text=input.value.trim();

if(!text){

alert("Note লিখুন!");

return;
}

let notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

notes.push(text);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

input.value="";

showNotes();

}


function showNotes(){

let notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

let list=
document.getElementById("notesList");

list.innerHTML="";

notes.forEach((note,index)=>{

list.innerHTML+=`

<div class="item">

${note}

<button
class="delete"
onclick="deleteNote(${index})">
🗑️
</button>

<div style="clear:both"></div>

</div>

`;

});

}


function deleteNote(index){

let notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

notes.splice(index,1);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

showNotes();

}


/* ================= TASK ================= */

function addTask(){

let input=
document.getElementById("taskInput");

let text=input.value.trim();

if(!text){

alert("Task লিখুন!");

return;
}

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks.push({
text:text,
done:false
});

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

input.value="";

showTasks();

}


function showTasks(){

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

let list=
document.getElementById("taskList");

list.innerHTML="";

tasks.forEach((task,index)=>{

list.innerHTML+=`

<div class="item">

<span
onclick="completeTask(${index})"
class="${task.done?'completed':''}">

${task.done?'✅':'⬜'}
${task.text}

</span>

<button
class="delete"
onclick="deleteTask(${index})">
🗑️
</button>

<div style="clear:both"></div>

</div>

`;

});

}


function completeTask(index){

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks[index].done=
!tasks[index].done;

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

}


function deleteTask(index){

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks.splice(index,1);

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

}


/* ================= START ================= */

showNotes();
showTasks();

</script>

</body>
</html>
