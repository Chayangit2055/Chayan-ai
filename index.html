<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAYAN AI</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:#ffffff;

    background:
    radial-gradient(circle at top left,#243b8f 0%,transparent 35%),
    radial-gradient(circle at bottom right,#7b1fa2 0%,transparent 35%),
    linear-gradient(135deg,#071126,#0d1b3d,#160d2e);

    padding:15px;
}

.app{
    max-width:520px;
    margin:auto;
}

/* HEADER */

.header{
    text-align:center;
    padding:30px 15px 20px;
}

.profile-box{
    width:130px;
    height:130px;
    margin:auto;
    padding:5px;
    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #00e5ff,
        #6c63ff,
        #ff4ecd
    );

    box-shadow:
    0 0 20px #00e5ff,
    0 0 40px rgba(108,99,255,.5);
}

.profile-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #10172d;
}

.title{
    margin:18px 0 5px;
    font-size:36px;
    font-weight:800;
    letter-spacing:2px;

    background:
    linear-gradient(
        90deg,
        #00e5ff,
        #ffffff,
        #b967ff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
    0 0 20px rgba(0,229,255,.5);
}

.subtitle{
    margin:0;
    color:#c9d4ff;
    font-size:15px;
    letter-spacing:1px;
}

/* CARD */

.card{
    margin:15px 0;
    padding:20px;
    border-radius:22px;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    border:
    1px solid rgba(255,255,255,.15);

    box-shadow:
    0 10px 30px rgba(0,0,0,.25);
}

.card h2{
    margin-top:0;
    font-size:20px;
}

/* INPUT */

input,
textarea{
    width:100%;
    border:none;
    outline:none;

    padding:14px;

    border-radius:14px;

    background:
    rgba(255,255,255,.12);

    color:white;

    font-size:16px;

    border:
    1px solid rgba(255,255,255,.12);

    margin-bottom:10px;
}

input::placeholder,
textarea::placeholder{
    color:#bfc8e8;
}

textarea{
    height:90px;
    resize:none;
}

/* BUTTON */

.main-btn{
    width:100%;
    border:none;

    padding:14px;

    border-radius:14px;

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #00b4db,
        #6c63ff,
        #a855f7
    );

    box-shadow:
    0 8px 20px rgba(108,99,255,.35);

    transition:.3s;
}

.main-btn:active{
    transform:scale(.97);
}

/* VOICE */

.voice-btn{
    display:block;

    width:100px;
    height:100px;

    margin:20px auto;

    border:none;
    border-radius:50%;

    color:white;
    font-size:38px;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        #00d4ff,
        #6c63ff,
        #ff4ecd
    );

    box-shadow:
    0 0 20px #00d4ff,
    0 0 45px rgba(108,99,255,.7);

    transition:.3s;
}

.voice-btn.active{
    animation:pulse 1s infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
        box-shadow:
        0 0 30px #00e5ff,
        0 0 60px #ff4ecd;
    }

    100%{
        transform:scale(1);
    }

}

.voice-text{

    text-align:center;

    padding:14px;

    border-radius:14px;

    color:#dce6ff;

    background:
    rgba(0,0,0,.18);

}

/* CHAT */

.chat-box{

    height:270px;

    overflow-y:auto;

    padding:10px;

    border-radius:16px;

    background:
    rgba(0,0,0,.18);

}

.message{

    max-width:85%;

    padding:12px;

    margin:9px 0;

    border-radius:16px;

    line-height:1.5;

}

.ai{

    background:
    linear-gradient(
        135deg,
        rgba(0,180,219,.25),
        rgba(108,99,255,.25)
    );

    border:
    1px solid rgba(0,229,255,.2);

}

.user{

    margin-left:auto;

    text-align:right;

    background:
    linear-gradient(
        135deg,
        #6c63ff,
        #9333ea
    );

}

/* NOTES AND TASKS */

.item{

    padding:13px;

    margin-top:10px;

    border-radius:14px;

    background:
    rgba(255,255,255,.08);

    border-left:
    3px solid #00e5ff;

    color:#e9edff;

}

.delete{

    float:right;

    border:none;

    background:transparent;

    color:white;

    cursor:pointer;

}

.done{

    text-decoration:line-through;

    opacity:.5;

}

.footer{

    text-align:center;

    color:#93a4d9;

    padding:20px;

    font-size:13px;

}

</style>
</head>


<body>

<div class="app">


<!-- HEADER -->

<div class="header">

<div class="profile-box">

<img
src="profile.jpg"
alt="Chayan">

</div>

<h1 class="title">
CHAYAN AI
</h1>

<p class="subtitle">
YOUR PERSONAL SMART VOICE ASSISTANT
</p>

</div>



<!-- VOICE -->

<div class="card">

<h2>🎤 Voice Assistant</h2>

<button
id="voiceBtn"
class="voice-btn"
onclick="startVoice()">

🎤

</button>

<div
id="voiceText"
class="voice-text">

মাইক্রোফোন চাপুন এবং বাংলায় কথা বলুন...

</div>

</div>



<!-- CHAT -->

<div class="card">

<h2>💬 AI Chat</h2>

<div
id="chatBox"
class="chat-box">

<div class="message ai">

🤖 হ্যালো Chayan! আমি আপনার CHAYAN AI। আমাকে কিছু বলুন।

</div>

</div>

<br>

<input
id="chatInput"
placeholder="এখানে আপনার প্রশ্ন লিখুন...">

<button
class="main-btn"
onclick="sendMessage()">

🚀 SEND MESSAGE

</button>

</div>



<!-- NOTES -->

<div class="card">

<h2>📝 Smart Notes</h2>

<textarea
id="noteInput"
placeholder="আপনার গুরুত্বপূর্ণ Note লিখুন..."></textarea>

<button
class="main-btn"
onclick="saveNote()">

💾 SAVE NOTE

</button>

<div id="notesList"></div>

</div>



<!-- TASKS -->

<div class="card">

<h2>📋 Daily Tasks</h2>

<input
id="taskInput"
placeholder="নতুন Task লিখুন...">

<button
class="main-btn"
onclick="addTask()">

➕ ADD TASK

</button>

<div id="taskList"></div>

</div>


<div class="footer">

© 2026 CHAYAN AI • Created by Chayan

</div>

</div>



<script>

/* VOICE */

function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Voice Recognition এর জন্য Chrome ব্যবহার করুন।");

return;
}

const recognition =
new SpeechRecognition();

recognition.lang="bn-BD";

recognition.continuous=false;

recognition.interimResults=false;

const button =
document.getElementById("voiceBtn");

const output =
document.getElementById("voiceText");

button.classList.add("active");

output.innerText="🎧 শুনছি...";

try{

recognition.start();

}catch(error){

output.innerText="Voice চালু আছে...";

}

recognition.onresult=function(event){

const text=
event.results[0][0].transcript;

output.innerText=
"🗣️ "+text;

document.getElementById(
"chatInput"
).value=text;

sendMessage();

};

recognition.onerror=function(event){

output.innerText=
"❌ Voice Error: "+
event.error;

button.classList.remove("active");

};

recognition.onend=function(){

button.classList.remove("active");

};

}



/* CHAT */

function sendMessage(){

const input=
document.getElementById("chatInput");

const text=
input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value="";

const answer=
smartAI(text);

setTimeout(function(){

addMessage(answer,"ai");

speak(answer);

},300);

}



function addMessage(text,type){

const box=
document.getElementById("chatBox");

const div=
document.createElement("div");

div.className=
"message "+type;

div.innerText=
(type==="ai"?"🤖 ":"👤 ")+text;

box.appendChild(div);

box.scrollTop=
box.scrollHeight;

}



/* SMART BRAIN */

function smartAI(text){

const q=text.toLowerCase().trim();

if(
q.includes("তুমি কে") ||
q.includes("তোমার নাম")
){

return "আমি CHAYAN AI। আমি Chayan-এর Personal Smart Voice Assistant।";

}

if(
q.includes("হ্যালো") ||
q.includes("হাই") ||
q.includes("hello")
){

return "হ্যালো Chayan! 😊 আমি কীভাবে সাহায্য করতে পারি?";

}

if(
q.includes("python") ||
q.includes("পাইথন")
){

return "Python একটি জনপ্রিয় Programming Language। এটি AI, Data Science, Web Development এবং Automation-এ ব্যবহার করা হয়।";

}

if(
q.includes("computer science") ||
q.includes("কম্পিউটার সায়েন্স")
){

return "Computer Science হলো Programming, Software, AI, Data Science, Networking এবং Technology নিয়ে কাজ করার একটি বড় ক্ষেত্র।";

}

if(
q.includes("কী করতে পারো") ||
q.includes("কি করতে পারো") ||
q.includes("help")
){

return "আমি Voice শুনতে পারি, কিছু Smart Command বুঝতে পারি, Note save করতে পারি এবং Task তৈরি করতে পারি।";

}

if(
q.includes("ধন্যবাদ") ||
q.includes("thanks")
){

return "আপনাকেও ধন্যবাদ Chayan! 😊";

}

return "আমি আপনার কথাটি বুঝেছি, কিন্তু এই প্রশ্নের উত্তর এখনো আমার Demo Brain-এ নেই। পরে আমাকে আরও Smart করা হবে।";

}



/* VOICE REPLY */

function speak(text){

if("speechSynthesis" in window){

speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(text);

speech.lang="bn-BD";

speech.rate=1;

speechSynthesis.speak(speech);

}

}



/* NOTES */

function saveNote(){

const input=
document.getElementById("noteInput");

const text=
input.value.trim();

if(!text){

alert("আগে Note লিখুন!");

return;

}

let notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

notes.push(text);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

input.value="";

showNotes();

}



function showNotes(){

const notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

const list=
document.getElementById("notesList");

list.innerHTML="";

notes.forEach(function(note,index){

list.innerHTML+=`

<div class="item">

${note}

<button
class="delete"
onclick="deleteNote(${index})">

🗑️

</button>

<div style="clear:both"></div>

</div>

`;

});

}



function deleteNote(index){

let notes=
JSON.parse(
localStorage.getItem("notes")
)||[];

notes.splice(index,1);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

showNotes();

}



/* TASKS */

function addTask(){

const input=
document.getElementById("taskInput");

const text=
input.value.trim();

if(!text){

alert("আগে Task লিখুন!");

return;

}

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks.push({
text:text,
done:false
});

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

input.value="";

showTasks();

}



function showTasks(){

const tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

const list=
document.getElementById("taskList");

list.innerHTML="";

tasks.forEach(function(task,index){

list.innerHTML+=`

<div class="item">

<span
onclick="completeTask(${index})"
class="${task.done?"done":""}">

${task.done?"✅":"⬜"}
${task.text}

</span>

<button
class="delete"
onclick="deleteTask(${index})">

🗑️

</button>

<div style="clear:both"></div>

</div>

`;

});

}



function completeTask(index){

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks[index].done=
!tasks[index].done;

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

}



function deleteTask(index){

let tasks=
JSON.parse(
localStorage.getItem("tasks")
)||[];

tasks.splice(index,1);

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

}



/* START */

showNotes();

showTasks();

</script>

</body>
</html>
