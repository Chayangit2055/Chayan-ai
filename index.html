<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAYAN AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  color:white;
  padding:15px;
  background:
  radial-gradient(circle at top left,#1d4ed8,transparent 40%),
  radial-gradient(circle at bottom right,#7c3aed,transparent 40%),
  linear-gradient(135deg,#06111f,#111936,#210d35);
}

.app{
  max-width:520px;
  margin:auto;
}

.header{
  text-align:center;
  padding:25px 10px;
}

.profile-box{
  width:130px;
  height:130px;
  margin:auto;
  padding:5px;
  border-radius:50%;
  background:linear-gradient(135deg,#00e5ff,#6c63ff,#ff4ecd);
  box-shadow:
  0 0 20px #00e5ff,
  0 0 50px rgba(108,99,255,.6);
}

.profile-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #111827;
}

.title{
  margin-top:18px;
  font-size:36px;
  font-weight:900;
  letter-spacing:2px;
  background:linear-gradient(90deg,#00e5ff,#ffffff,#d946ef);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  margin-top:8px;
  color:#cbd5ff;
  font-size:14px;
  letter-spacing:1px;
}

.card{
  margin-bottom:16px;
  padding:18px;
  border-radius:22px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(15px);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.card h2{
  margin-bottom:15px;
}

/* VOICE */

.voice-btn{
  display:block;
  width:110px;
  height:110px;
  margin:15px auto;
  border:none;
  border-radius:50%;
  font-size:42px;
  cursor:pointer;
  background:linear-gradient(135deg,#00e5ff,#6c63ff,#ec4899);
  box-shadow:
  0 0 25px #00d9ff,
  0 0 55px rgba(139,92,246,.7);
}

.voice-btn.active{
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{
    transform:scale(1.15);
    box-shadow:
    0 0 35px #00e5ff,
    0 0 70px #ec4899;
  }
  100%{transform:scale(1)}
}

.voice-text{
  text-align:center;
  padding:14px;
  border-radius:14px;
  background:rgba(0,0,0,.25);
  color:#dbeafe;
}

/* CHAT */

.chat-box{
  height:300px;
  overflow-y:auto;
  padding:10px;
  border-radius:16px;
  background:rgba(0,0,0,.25);
}

.message{
  max-width:88%;
  padding:12px;
  margin:10px 0;
  border-radius:16px;
  line-height:1.5;
  word-wrap:break-word;
}

.ai{
  background:linear-gradient(
    135deg,
    rgba(0,229,255,.20),
    rgba(108,99,255,.30)
  );
  border:1px solid rgba(0,229,255,.25);
}

.user{
  margin-left:auto;
  background:linear-gradient(135deg,#4f46e5,#9333ea);
}

input,
textarea{
  width:100%;
  border:none;
  outline:none;
  padding:14px;
  margin-top:12px;
  color:white;
  font-size:16px;
  border-radius:14px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.14);
}

input::placeholder,
textarea::placeholder{
  color:#cbd5e1;
}

textarea{
  height:90px;
  resize:none;
}

.main-btn{
  width:100%;
  border:none;
  margin-top:10px;
  padding:14px;
  border-radius:14px;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(
    90deg,
    #00b4db,
    #6366f1,
    #a855f7
  );
}

.item{
  padding:13px;
  margin-top:10px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  border-left:3px solid #00e5ff;
}

.delete{
  float:right;
  border:none;
  background:none;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.done{
  text-decoration:line-through;
  opacity:.5;
}

.footer{
  text-align:center;
  color:#9ca3af;
  padding:15px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">

  <div class="profile-box">
    <img src="profile.jpg" alt="Chayan">
  </div>

  <h1 class="title">CHAYAN AI</h1>

  <p class="subtitle">
    YOUR PERSONAL REAL AI VOICE ASSISTANT
  </p>

</div>


<!-- VOICE -->

<div class="card">

  <h2>🎤 Talk With CHAYAN AI</h2>

  <button
    id="voiceBtn"
    class="voice-btn"
    onclick="startVoice()">
    🎤
  </button>

  <div
    id="voiceText"
    class="voice-text">
    মাইক্রোফোন চাপুন এবং কথা বলুন...
  </div>

</div>


<!-- CHAT -->

<div class="card">

  <h2>💬 REAL AI CHAT</h2>

  <div id="chatBox" class="chat-box">

    <div class="message ai">
      🤖 হ্যালো Chayan! আমি CHAYAN AI। তুমি যা জানতে চাও, আমাকে জিজ্ঞাসা করতে পারো।
    </div>

  </div>

  <input
    id="chatInput"
    placeholder="এখানে প্রশ্ন লিখুন অথবা Voice ব্যবহার করুন...">

  <button
    class="main-btn"
    onclick="sendMessage()">
    🚀 ASK CHAYAN AI
  </button>

</div>


<!-- NOTES -->

<div class="card">

  <h2>📝 SMART NOTES</h2>

  <textarea
    id="noteInput"
    placeholder="গুরুত্বপূর্ণ Note লিখুন..."></textarea>

  <button
    class="main-btn"
    onclick="saveNote()">
    💾 SAVE NOTE
  </button>

  <div id="notesList"></div>

</div>


<!-- TASKS -->

<div class="card">

  <h2>📋 DAILY TASKS</h2>

  <input
    id="taskInput"
    placeholder="নতুন Task লিখুন...">

  <button
    class="main-btn"
    onclick="addTask()">
    ➕ ADD TASK
  </button>

  <div id="taskList"></div>

</div>


<div class="footer">
  © 2026 CHAYAN AI • Created by Chayan
</div>

</div>


<script>

/* =========================
   REAL AI BRAIN URL
========================= */

const AI_SERVER =
"https://chayan-ai.chayangosh98.workers.dev/";


/* =========================
   VOICE
========================= */

function startVoice(){

  const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice Recognition এর জন্য Google Chrome ব্যবহার করুন।"
    );

    return;
  }

  const recognition =
  new SpeechRecognition();

  recognition.lang = "bn-BD";

  recognition.continuous = false;

  recognition.interimResults = false;

  const button =
  document.getElementById("voiceBtn");

  const output =
  document.getElementById("voiceText");

  button.classList.add("active");

  output.innerText =
  "🎧 শুনছি... কথা বলুন";

  try{

    recognition.start();

  }catch(error){

    output.innerText =
    "🎧 Voice ইতিমধ্যে চলছে...";

  }


  recognition.onresult =
  function(event){

    const text =
    event.results[0][0].transcript;

    output.innerText =
    "🗣️ আপনি বলেছেন: " + text;

    document.getElementById(
      "chatInput"
    ).value = text;


    /* AUTOMATICALLY SEND */

    sendMessage();

  };


  recognition.onerror =
  function(event){

    let message =
    "❌ Voice Error: " +
    event.error;

    if(event.error === "not-allowed"){

      message =
      "❌ Microphone Permission Allow করুন";

    }

    output.innerText = message;

    button.classList.remove("active");

  };


  recognition.onend =
  function(){

    button.classList.remove("active");

  };

}


/* =========================
   SEND TO REAL AI
========================= */

async function sendMessage(){

  const input =
  document.getElementById("chatInput");

  const text =
  input.value.trim();

  if(!text) return;


  /* USER MESSAGE */

  addMessage(
    text,
    "user"
  );

  input.value = "";


  /* THINKING */

  const thinking =
  document.createElement("div");

  thinking.className =
  "message ai";

  thinking.id =
  "thinking";

  thinking.innerText =
  "🤖 CHAYAN AI ভাবছে...";

  const chatBox =
  document.getElementById("chatBox");

  chatBox.appendChild(thinking);

  chatBox.scrollTop =
  chatBox.scrollHeight;


  try{

    const response =
    await fetch(
      AI_SERVER,
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          message:text
        })

      }
    );


    const data =
    await response.json();


    /* REMOVE THINKING */

    const thinkingBox =
    document.getElementById("thinking");

    if(thinkingBox){

      thinkingBox.remove();

    }


    const answer =
    data.reply ||
    "দুঃখিত, আমি উত্তর দিতে পারিনি।";


    /* SHOW ANSWER */

    addMessage(
      answer,
      "ai"
    );


    /* SPEAK ANSWER */

    speak(answer);


  }

  catch(error){

    const thinkingBox =
    document.getElementById("thinking");

    if(thinkingBox){

      thinkingBox.remove();

    }


    const answer =
    "দুঃখিত Chayan, AI Server-এর সাথে যোগাযোগ করা যাচ্ছে না।";


    addMessage(
      answer,
      "ai"
    );

    speak(answer);

  }

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  text,
  type
){

  const box =
  document.getElementById("chatBox");

  const div =
  document.createElement("div");

  div.className =
  "message " + type;

  div.innerText =
  type === "ai"
  ? "🤖 " + text
  : "👤 " + text;

  box.appendChild(div);

  box.scrollTop =
  box.scrollHeight;

}


/* =========================
   SPEAK AI ANSWER
========================= */

function speak(text){

  if(
    "speechSynthesis" in window
  ){

    window.speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.lang = "bn-BD";

    speech.rate = 1;

    speech.pitch = 1;

    window.speechSynthesis.speak(speech);

  }

}


/* =========================
   NOTES
========================= */

function saveNote(){

  const input =
  document.getElementById("noteInput");

  const text =
  input.value.trim();

  if(!text){

    alert("আগে একটি Note লিখুন!");

    return;
  }

  let notes =
  JSON.parse(
    localStorage.getItem("notes")
  ) || [];

  notes.push(text);

  localStorage.setItem(
    "notes",
    JSON.stringify(notes)
  );

  input.value = "";

  showNotes();

}


function showNotes(){

  const notes =
  JSON.parse(
    localStorage.getItem("notes")
  ) || [];

  const list =
  document.getElementById("notesList");

  list.innerHTML = "";

  notes.forEach(
    function(note,index){

      const item =
      document.createElement("div");

      item.className =
      "item";

      const text =
      document.createElement("span");

      text.innerText = note;

      const button =
      document.createElement("button");

      button.className =
      "delete";

      button.innerText =
      "🗑️";

      button.onclick =
      function(){

        deleteNote(index);

      };

      item.appendChild(text);

      item.appendChild(button);

      list.appendChild(item);

    }
  );

}


function deleteNote(index){

  let notes =
  JSON.parse(
    localStorage.getItem("notes")
  ) || [];

  notes.splice(index,1);

  localStorage.setItem(
    "notes",
    JSON.stringify(notes)
  );

  showNotes();

}


/* =========================
   TASKS
========================= */

function addTask(){

  const input =
  document.getElementById("taskInput");

  const text =
  input.value.trim();

  if(!text){

    alert("আগে একটি Task লিখুন!");

    return;
  }

  let tasks =
  JSON.parse(
    localStorage.getItem("tasks")
  ) || [];

  tasks.push({
    text:text,
    done:false
  });

  localStorage.setItem(
    "tasks",
    JSON.stringify(tasks)
  );

  input.value = "";

  showTasks();

}


function showTasks(){

  const tasks =
  JSON.parse(
    localStorage.getItem("tasks")
  ) || [];

  const list =
  document.getElementById("taskList");

  list.innerHTML = "";

  tasks.forEach(
    function(task,index){

      const item =
      document.createElement("div");

      item.className =
      "item";

      const taskText =
      document.createElement("span");

      taskText.innerText =
      (task.done ? "✅ " : "⬜ ")
      + task.text;


      if(task.done){

        taskText.classList.add(
          "done"
        );

      }


      taskText.onclick =
      function(){

        completeTask(index);

      };


      const button =
      document.createElement("button");

      button.className =
      "delete";

      button.innerText =
      "🗑️";

      button.onclick =
      function(){

        deleteTask(index);

      };


      item.appendChild(taskText);

      item.appendChild(button);

      list.appendChild(item);

    }
  );

}


function completeTask(index){

  let tasks =
  JSON.parse(
    localStorage.getItem("tasks")
  ) || [];

  tasks[index].done =
  !tasks[index].done;

  localStorage.setItem(
    "tasks",
    JSON.stringify(tasks)
  );

  showTasks();

}


function deleteTask(index){

  let tasks =
  JSON.parse(
    localStorage.getItem("tasks")
  ) || [];

  tasks.splice(index,1);

  localStorage.setItem(
    "tasks",
    JSON.stringify(tasks)
  );

  showTasks();

}


/* =========================
   ENTER KEY
========================= */

document
.getElementById("chatInput")
.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      sendMessage();

    }

  }
);


/* =========================
   START
========================= */

showNotes();

showTasks();

</script>

</body>
</html>
