<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAYAN AI</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f1f3f6;
    padding:15px;
}

.app{
    max-width:520px;
    margin:auto;
}

.header{
    text-align:center;
    padding:20px 10px;
}

.header h1{
    margin:0;
    font-size:32px;
}

.header p{
    color:#666;
}

.card{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
}

input,textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    margin-bottom:10px;
}

textarea{
    height:90px;
    resize:none;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
}

.main-btn{
    width:100%;
    background:#222;
    color:white;
    font-size:16px;
}

.voice-btn{
    display:block;
    width:90px;
    height:90px;
    margin:20px auto;
    border-radius:50%;
    background:#222;
    color:white;
    font-size:35px;
}

.voice-btn.listening{
    transform:scale(1.1);
}

.voice-text{
    background:#f5f5f5;
    padding:13px;
    border-radius:10px;
    text-align:center;
    min-height:45px;
}

.status{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
}

.chat-box{
    height:250px;
    overflow-y:auto;
    background:#f5f5f5;
    padding:10px;
    border-radius:12px;
    margin-bottom:10px;
}

.msg{
    padding:10px;
    margin:7px 0;
    border-radius:10px;
}

.user{
    background:#ddd;
    text-align:right;
}

.ai{
    background:#e9e9e9;
}

.item{
    background:#f6f6f6;
    padding:12px;
    margin-top:8px;
    border-radius:10px;
}

.delete{
    float:right;
    background:none;
    padding:3px;
}

.completed{
    text-decoration:line-through;
    opacity:.5;
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<h1>🤖 CHAYAN AI</h1>

<p>
Bangla Smart Voice Assistant
</p>

</div>


<!-- VOICE -->

<div class="card">

<h2>🎤 Voice Assistant</h2>

<p style="text-align:center;">
বাংলায় কথা বলুন
</p>

<button
id="voiceBtn"
class="voice-btn"
onclick="startVoice()">

🎤

</button>

<div
id="voiceText"
class="voice-text">

মাইক্রোফোন চাপুন এবং কথা বলুন...

</div>

<div
id="status"
class="status">
</div>

</div>


<!-- CHAT -->

<div class="card">

<h2>💬 CHAYAN AI Chat</h2>

<div
id="chatBox"
class="chat-box">

<div class="msg ai">

🤖 আমি CHAYAN AI।  
আপনি আমাকে প্রশ্ন করতে পারেন।

</div>

</div>

<input
id="chatInput"
placeholder="আপনার প্রশ্ন লিখুন...">

<button
class="main-btn"
onclick="sendChat()">

🚀 Send

</button>

</div>


<!-- NOTES -->

<div class="card">

<h2>📝 Notes</h2>

<textarea
id="noteInput"
placeholder="আপনার Note লিখুন..."></textarea>

<button
class="main-btn"
onclick="saveNote()">

💾 Save Note

</button>

<div id="notesList"></div>

</div>


<!-- TASK -->

<div class="card">

<h2>📋 Daily Tasks</h2>

<input
id="taskInput"
placeholder="আপনার Task লিখুন...">

<button
class="main-btn"
onclick="addTask()">

➕ Add Task

</button>

<div id="taskList"></div>

</div>

</div>


<script>

/* =================================
VOICE RECOGNITION
================================= */

function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"আপনার browser Voice Recognition support করছে না। Chrome ব্যবহার করুন।"
);

return;
}

const recognition =
new SpeechRecognition();

recognition.lang = "bn-BD";

recognition.continuous = false;

recognition.interimResults = false;


const button =
document.getElementById("voiceBtn");

const output =
document.getElementById("voiceText");

const status =
document.getElementById("status");


button.classList.add("listening");

output.innerText =
"🎧 শুনছি...";

status.innerText =
"কথা বলুন...";


try{

recognition.start();

}catch(error){

status.innerText =
"Voice already running...";

}


recognition.onresult =
function(event){

const text =
event.results[0][0].transcript;

output.innerText =
"🗣️ " + text;

status.innerText =
"✅ বুঝেছি";

document.getElementById(
"chatInput"
).value = text;

sendChat();

};


recognition.onerror =
function(event){

button.classList.remove(
"listening"
);

status.innerText =
"❌ Voice Error: " +
event.error;

};


recognition.onend =
function(){

button.classList.remove(
"listening"
);

};

}


/* =================================
CHAT
================================= */

function sendChat(){

const input =
document.getElementById(
"chatInput"
);

const text =
input.value.trim();

if(!text){

return;
}

addMessage(
text,
"user"
);

input.value = "";


const answer =
smartBrain(text);


setTimeout(function(){

addMessage(
answer,
"ai"
);

speak(answer);

},300);

}


/* =================================
ADD CHAT MESSAGE
================================= */

function addMessage(
text,
type
){

const box =
document.getElementById(
"chatBox"
);

const div =
document.createElement(
"div"
);

div.className =
"msg " + type;

if(type === "ai"){

div.innerText =
"🤖 " + text;

}else{

div.innerText =
"👤 " + text;

}

box.appendChild(div);

box.scrollTop =
box.scrollHeight;

}


/* =================================
SMART BRAIN
================================= */

function smartBrain(text){

const q =
text
.toLowerCase()
.trim();


/* IDENTITY */

if(
q.includes("তুমি কে") ||
q.includes("তুমি কি") ||
q.includes("তোমার নাম") ||
q.includes("who are you") ||
q.includes("tumi ke")
){

return "আমি CHAYAN AI। আমি আপনার বাংলা Smart Voice Assistant।";

}


/* HELLO */

if(
q.includes("হ্যালো") ||
q.includes("হাই") ||
q.includes("hello") ||
q.includes("hi")
){

return "হ্যালো! 😊 আমি CHAYAN AI। কীভাবে সাহায্য করতে পারি?";

}


/* PYTHON */

if(
q.includes("python") ||
q.includes("পাইথন")
){

return "Python একটি জনপ্রিয় programming language। এটি AI, Data Science, Web Development এবং Automation-এ ব্যবহার করা হয়।";

}


/* COMPUTER SCIENCE */

if(
q.includes("computer science") ||
q.includes("কম্পিউটার সায়েন্স") ||
q.includes("কম্পিউটার সাইন্স")
){

return "Computer Science হলো computing, programming, software, algorithms, database, AI এবং computer technology নিয়ে পড়াশোনার একটি বড় ক্ষেত্র।";

}


/* THANK YOU */

if(
q.includes("ধন্যবাদ") ||
q.includes("thanks") ||
q.includes("thank you")
){

return "আপনাকেও ধন্যবাদ! 😊";

}


/* SHOW NOTES */

if(
q.includes("নোট দেখাও") ||
q.includes("notes দেখাও") ||
q.includes("note দেখাও")
){

const notes =
JSON.parse(
localStorage.getItem("notes")
) || [];

return "আপনার মোট " +
notes.length +
"টি Note আছে।";

}


/* SHOW TASK */

if(
q.includes("কাজ দেখাও") ||
q.includes("task দেখাও") ||
q.includes("টাস্ক দেখাও")
){

const tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

return "আপনার মোট " +
tasks.length +
"টি Task আছে।";

}


/* NOTE COMMAND */

if(
q.includes("note") ||
q.includes("নোট")
){

let note =
text
.replace(/note/gi,"")
.replace(/নোট/g,"")
.replace(/করো/g,"")
.trim();

if(note){

let notes =
JSON.parse(
localStorage.getItem("notes")
) || [];

notes.push(note);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

showNotes();

return "ঠিক আছে। আমি Note save করেছি।";

}

}


/* TASK COMMAND */

if(
q.includes("task") ||
q.includes("টাস্ক") ||
q.includes("কাজ যোগ")
){

let task =
text
.replace(/task/gi,"")
.replace(/টাস্ক/g,"")
.replace(/কাজ/g,"")
.replace(/যোগ করো/g,"")
.trim();

if(task){

let tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

tasks.push({

text:task,

done:false

});

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

return "ঠিক আছে। আমি Task যোগ করেছি।";

}

}


/* UNKNOWN */

return "দুঃখিত। এই প্রশ্নের উত্তর এখনো আমার Demo Brain-এ নেই। আমাকে আরও Smart করা যাবে।";

}


/* =================================
TEXT TO SPEECH
================================= */

function speak(text){

if(
"speechSynthesis"
in window
){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(
text
);

speech.lang =
"bn-BD";

speech.rate =
1;

speech.pitch =
1;

window.speechSynthesis.speak(
speech
);

}

}


/* =================================
NOTES
================================= */

function saveNote(){

const input =
document.getElementById(
"noteInput"
);

const text =
input.value.trim();

if(!text){

alert("আগে Note লিখুন!");

return;
}

let notes =
JSON.parse(
localStorage.getItem("notes")
) || [];

notes.push(text);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

input.value = "";

showNotes();

}


function showNotes(){

let notes =
JSON.parse(
localStorage.getItem("notes")
) || [];

const list =
document.getElementById(
"notesList"
);

list.innerHTML = "";

notes.forEach(
function(note,index){

list.innerHTML += `

<div class="item">

${escapeHTML(note)}

<button
class="delete"
onclick="deleteNote(${index})">

🗑️

</button>

<div style="clear:both"></div>

</div>

`;

});

}


function deleteNote(index){

let notes =
JSON.parse(
localStorage.getItem("notes")
) || [];

notes.splice(index,1);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

showNotes();

}


/* =================================
TASKS
================================= */

function addTask(){

const input =
document.getElementById(
"taskInput"
);

const text =
input.value.trim();

if(!text){

alert("আগে Task লিখুন!");

return;
}

let tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

tasks.push({

text:text,

done:false

});

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

input.value = "";

showTasks();

}


function showTasks(){

let tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

const list =
document.getElementById(
"taskList"
);

list.innerHTML = "";

tasks.forEach(
function(task,index){

list.innerHTML += `

<div class="item">

<span
onclick="completeTask(${index})"
class="${
task.done
?
"completed"
:
""
}">

${
task.done
?
"✅"
:
"⬜"
}

${escapeHTML(task.text)}

</span>

<button
class="delete"
onclick="deleteTask(${index})">

🗑️

</button>

<div style="clear:both"></div>

</div>

`;

});

}


function completeTask(index){

let tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

tasks[index].done =
!tasks[index].done;

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

}


function deleteTask(index){

let tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

tasks.splice(index,1);

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

showTasks();

}


/* =================================
SECURITY
================================= */

function escapeHTML(text){

const div =
document.createElement(
"div"
);

div.textContent =
text;

return div.innerHTML;

}


/* =================================
START
================================= */

showNotes();

showTasks();

</script>

</body>
</html>
